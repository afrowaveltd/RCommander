# RCommander language pack — English (built-in reference pack)
#
# This file is the authoritative key list: every other pack is expected to
# translate all of these keys. Values may contain {name} placeholders that the
# GUI fills in with Translator::t_args(); unknown placeholders are left alone.
#
# Format:
#   [meta]    — describes the pack itself
#   [strings] — "dotted.key" = "translated text"

[meta]
code = "en"
name = "English"
native_name = "English"
direction = "ltr"
version = 1
authors = ["RCommander contributors"]

[strings]

