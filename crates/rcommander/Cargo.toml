[package]
name = "rcommander"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RCommander — a cross-platform dual-pane file manager"

[lib]
name = "rcommander"
path = "src/lib.rs"

[[bin]]
name = "rcommander"
path = "src/main.rs"

[dependencies]
rc-core = { path = "../rc-core" }
rc-i18n = { path = "../rc-i18n" }
rc-viewer = { path = "../rc-viewer" }
rc-archive = { path = "../rc-archive" }
rc-help = { path = "../rc-help" }
rc-llm = { path = "../rc-llm" }
rc-runtime = { path = "../rc-runtime" }
rc-agent = { path = "../rc-agent" }
rc-git = { path = "../rc-git" }
rc-remote = { path = "../rc-remote", features = ["sftp"] }
regex = "1"
# Already present in Cargo.lock; keep the preview's XML parser on this reviewed version.
quick-xml = { version = "=0.41.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }

# Desktop windowing backends; kept target-scoped so the Android build does not
# inherit X11/Wayland/AccessKit features that do not exist there.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "x11", "accesskit", "clipboard", "links"] }

# On Android the window shell comes from winit's NativeActivity backend.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["android-native-activity"] }

[dev-dependencies]
tempfile = { workspace = true }
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }
# Reads the bundled icon font in tests, so a glyph that the font does not contain
# fails the suite instead of panicking in front of the user.
read-fonts = "0.41"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

# Metadata read by `cargo apk`, see android/README.md.
[package.metadata.android]
package = "org.rcommander.app"
apk_name = "rcommander"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
assets = ["../Docs", "../locales"]
min_sdk_version = 26
target_sdk_version = 34
