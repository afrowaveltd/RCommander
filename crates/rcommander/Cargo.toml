[package]
name = "rcommander"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "RCommander — a cross-platform dual-pane file manager"

[lib]
name = "rcommander"
path = "src/lib.rs"

[[bin]]
name = "rcommander"
path = "src/main.rs"

[dependencies]
rc-core = { path = "../rc-core" }
rc-i18n = { path = "../rc-i18n" }
rc-viewer = { path = "../rc-viewer" }
rc-archive = { path = "../rc-archive" }
rc-help = { path = "../rc-help" }
rc-agent = { path = "../rc-agent" }
rc-remote = { path = "../rc-remote" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.37", features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
arboard = "3.7"
open = "5"

[dev-dependencies]
tempfile = { workspace = true }
egui_kittest = { version = "0.37", features = ["eframe", "wgpu"] }

# Metadata read by `cargo apk`, see android/README.md.
[package.metadata.android]
package = "org.rcommander.app"
apk_name = "rcommander"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
assets = ["../Docs", "../locales"]
min_sdk_version = 26
target_sdk_version = 34
