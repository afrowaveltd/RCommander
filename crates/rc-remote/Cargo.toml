[package]
name = "rc-remote"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FTP/FTPS/SFTP client and the shared remote file-system interface of RCommander"

[features]
default = []
# SFTP through libssh2. Needs OpenSSL (or `ssh2/vendored-openssl` when the
# platform has no OpenSSL development files).
sftp = ["dep:ssh2"]
# FTPS through the platform TLS stack (OpenSSL / SChannel / Secure Transport).
ftps = ["dep:native-tls"]

[dependencies]
rc-core = { path = "../rc-core" }
encoding_rs = "0.8"
thiserror = "2"
ssh2 = { version = "0.9", optional = true }
native-tls = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = "3"
