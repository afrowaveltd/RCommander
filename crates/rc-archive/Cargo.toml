[package]
name = "rc-archive"
version = "0.1.0"
edition = "2024"
# `sevenz-rust2` 0.25 requires Rust 1.93, so this crate cannot claim less.
rust-version = "1.93"
license = "MIT"
description = "Archive engine for RCommander: list, read, extract, create, modify and test archives"
repository = "https://example.invalid/rcommander"

[dependencies]
rc-core = { path = "../rc-core" }
thiserror = "2"
tempfile = "3"
crc32fast = "1"

# Zip read + write (stored and deflated members, unicode names, zip64).
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# Tar container read + write.
tar = "0.4"

# Streaming decompressors, all with pure-Rust backends.
flate2 = "1"
bzip2 = "0.6"
ruzstd = "0.9"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }

# 7-zip reading.
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "ppmd"] }

[dev-dependencies]
tempfile = "3"
# Encoders are only needed to build test fixtures.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz", "encoder"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd"] }
