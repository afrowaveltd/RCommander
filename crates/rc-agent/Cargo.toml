[package]
name = "rc-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["RCommander contributors"]
repository = "https://example.invalid/rcommander"
description = "Model Context Protocol (MCP) server and client for RCommander: expose file-manager capabilities to AI agents and consume external MCP servers"

[dependencies]
rc-core = { path = "../rc-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
