name: Linux UI regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/linux-ui-regressions.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/rc-remote/src/spec.rs"
      - "crates/rc-core/src/drive.rs"
      - "crates/rc-core/src/config.rs"
      - "crates/rc-core/src/model_catalog.rs"
      - "crates/rc-core/src/quota.rs"
      - "crates/rc-core/src/admission.rs"
      - "crates/rc-llm/src/**"
      - "crates/rc-core/src/lib.rs"
      - "crates/rc-core/src/policy.rs"
      - "crates/rcommander/src/model/sessions.rs"
      - "crates/rcommander/src/model/remote.rs"
      - "crates/rcommander/src/model/dialogs.rs"
      - "crates/rc-help/src/markdown.rs"
      - "crates/rcommander/src/model/actions.rs"
      - "crates/rcommander/src/model/commands.rs"
      - "crates/rcommander/src/model/tests.rs"
      - "crates/rcommander/src/ui/app.rs"
      - "crates/rcommander/src/ui/editor_window.rs"
      - "crates/rcommander/src/ui/viewer_window.rs"
      - "crates/rcommander/src/ui/workspace_window.rs"
      - "crates/rcommander/src/model/surfaces.rs"
      - "crates/rcommander/src/model/mod.rs"
      - "crates/rcommander/src/ui/dialogs.rs"
      - "crates/rcommander/src/ui/panel_view.rs"
      - "crates/rcommander/tests/ui_smoke.rs"
      - "crates/rc-i18n/locales/**"
      - "locales/**"

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev
      - name: Volume picker, settings and Markdown
        run: |
          cargo test --locked -p rc-core --lib saved_connection_debug_redacts_credentials
          cargo test --locked -p rc-core --lib saved_connection_account_ids_use_canonical_protocol_and_effective_port
          cargo test --locked -p rc-core --lib a_new_connection_has_a_usable_host_and_port
          cargo test --locked -p rc-remote --lib spec::tests
          cargo test --locked -p rc-core --lib policy::tests
          cargo test --locked -p rc-core --lib model_catalog::tests
          cargo test --locked -p rc-core --lib quota::tests
          cargo test --locked -p rc-core --lib admission::tests
          cargo test --locked -p rc-llm
          cargo test --locked -p rc-core --lib drive::
          cargo test --locked -p rc-core --lib the_button_bar_round_trips_through_toml
          cargo test --locked -p rc-help --lib inline_math
      - name: Model and headless UI regressions
        run: |
          cargo test --locked -p rcommander --lib model::sessions::tests
          cargo test --locked -p rcommander --lib model::remote::tests
          cargo test --locked -p rcommander --lib model::surfaces::tests
          cargo test --locked -p rcommander --test ui_smoke document_surfaces_can_share_the_two_panels_without_losing_editor_text
          cargo test --locked -p rcommander --test ui_smoke f3_and_f4_open_the_expected_workspace_surface
          cargo test --locked -p rcommander --lib a_saved_connection_maps_to_a_connection_spec
          cargo test --locked -p rcommander --lib toolbar_
          cargo test --locked -p rcommander --lib action_catalogue
          cargo test --locked -p rcommander --test ui_smoke drive_selector_is_shown_in_each_panel_and_respects_layout_setting
          cargo test --locked -p rcommander --test ui_smoke toolbar_default_captions_are_localized_and_custom_caption_is_preserved
          cargo test --locked -p rcommander --test ui_smoke the_agent_menu_offers_the_way_back_only_while_a_pane_shows_the_chat
          cargo test --locked -p rcommander --test ui_smoke tool_bar_and_function_keys_are_rendered
          cargo test --locked -p rcommander --test ui_smoke connecting_runs_in_the_background_and_reports_the_failure
