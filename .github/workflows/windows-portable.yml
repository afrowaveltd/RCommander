name: Windows portable test build

# Build on manual dispatch or packaging-workflow changes.
# Frequent normal source commits do not launch expensive builds.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/windows-portable.yml"

permissions:
  contents: write # For publishing the test executable as a GitHub Release asset.

jobs:
  windows-x64:
    name: Compile RCommander (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable Rust (Windows MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache dependencies and build results
        uses: Swatinem/rust-cache@v2

      # SFTP uses libssh2/OpenSSL: link OpenSSL statically so no OpenSSL DLL
      # is required at runtime when running the portable ZIP.
      - name: Install MSVC OpenSSL with vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) { throw 'vcpkg unavailable on runner' }
          & 'C:\vcpkg\vcpkg.exe' install openssl:x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg OpenSSL installation failed' }

      - name: Run Windows regression tests for drives, chat, plugins and prompts
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
        run: |
          cargo test --locked -p rc-core --lib windows_volumes_use_drive_letter_roots
          if ($LASTEXITCODE -ne 0) { throw 'Windows drive enumeration test failed' }
          cargo test --locked -p rcommander --lib delete_confirmation_tests
          if ($LASTEXITCODE -ne 0) { throw 'Delete confirmation test failed' }
          cargo test --locked -p rcommander --test ui_smoke drive_selector_is_shown_in_each_panel_and_respects_layout_setting
          if ($LASTEXITCODE -ne 0) { throw 'Drive-picker UI test failed' }
          cargo test --locked -p rc-core --lib prompt
          if ($LASTEXITCODE -ne 0) { throw 'Prompt catalogue tests failed' }
          cargo test --locked -p rcommander --test ui_smoke the_prompt_picker_offers_the_catalogue_and_inserts_the_filled_text
          if ($LASTEXITCODE -ne 0) { throw 'Prompt picker UI test failed' }
          cargo test --locked -p rc-llm
          if ($LASTEXITCODE -ne 0) { throw 'LLM transport tests failed' }
          cargo test --locked -p rcommander --lib model::chat::tests
          if ($LASTEXITCODE -ne 0) { throw 'Chat model tests failed' }
          cargo test --locked -p rc-core --lib plugin
          if ($LASTEXITCODE -ne 0) { throw 'Plugin manifest tests failed' }
          cargo test --locked -p rcommander --lib model::plugins::tests
          if ($LASTEXITCODE -ne 0) { throw 'Plugin model tests failed' }
          cargo test --locked -p rcommander --test ui_smoke the_chat_window_opens_from_the_menu_and_streams_an_answer
          if ($LASTEXITCODE -ne 0) { throw 'Chat window UI test failed' }
          cargo test --locked -p rcommander --test ui_smoke the_plugins_page_lists_what_is_installed_and_switches_it_off
          if ($LASTEXITCODE -ne 0) { throw 'Plugin manager UI test failed' }
          cargo test --locked -p rcommander --test ui_smoke processing_with_the_agent_opens_a_chat_about_a_copy
          if ($LASTEXITCODE -ne 0) { throw 'Agent workspace handoff test failed' }

      - name: Compile Windows x64 release
        shell: pwsh
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKGRS_TRIPLET: x64-windows-static-md
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p rcommander
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }

      - name: Package portable ZIP with runtime data
        shell: pwsh
        run: |
          $exe = 'target\x86_64-pc-windows-msvc\release\rcommander.exe'
          if (-not (Test-Path $exe)) { throw 'Missing rcommander.exe' }
          $dest = Join-Path $env:RUNNER_TEMP 'RCommander-Windows-x64'
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item $exe $dest
          foreach ($name in @('locales', 'Docs', 'themes', 'prompts', 'plugins')) {
            if (-not (Test-Path $name -PathType Container)) { throw "Missing folder: $name" }
            Copy-Item $name (Join-Path $dest $name) -Recurse
          }
          Copy-Item README.md $dest
          Copy-Item LICENSE $dest
          $notes = @(
            'RCommander - Windows x64 portable test build',
            '',
            'Extract the entire ZIP, then run rcommander.exe.',
            'Keep Docs, locales, themes, prompts and plugins alongside the executable.',
            'No Rust installation is required on the target PC.',
            'This build is UNSIGNED; workplace endpoint policies may block it.',
            'Do not bypass your employer security policy.',
            'Configuration defaults to %APPDATA%\RCommander.',
            'Set RCOMMANDER_CONFIG_DIR for a custom configuration directory.'
          )
          $notes | Set-Content (Join-Path $dest 'WINDOWS-README.txt') -Encoding utf8
          Compress-Archive -Path "$dest\*" -DestinationPath 'RCommander-Windows-x64.zip' -Force
          $zip = Get-Item 'RCommander-Windows-x64.zip'
          Write-Host "Package: $($zip.Length) bytes"
          if ($zip.Length -lt 200000) { throw 'Suspiciously small ZIP' }

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: RCommander-Windows-x64
          path: RCommander-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Publish public Windows test prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-test-${{ github.run_number }}"
          $sha = "${{ github.sha }}"
          gh release create $tag 'RCommander-Windows-x64.zip' --repo "${{ github.repository }}" --target $sha --title "RCommander Windows test build #${{ github.run_number }}" --notes "Unsigned Windows x64 portable test build from commit $sha. Extract ZIP and start rcommander.exe; locales, Docs, themes, prompts and plugin examples are included. No Rust required. Obey workplace endpoint policies." --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
