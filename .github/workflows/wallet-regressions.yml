name: Wallet regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wallet-regressions.yml"
      - "crates/rc-core/src/secrets.rs"
      - "crates/rc-core/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/wallet-regressions.yml"
      - "crates/rc-core/src/secrets.rs"
      - "crates/rc-core/Cargo.toml"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  secrets:
    name: Wallet tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test encrypted credential store
        run: cargo test --locked -p rc-core --lib secrets::tests
