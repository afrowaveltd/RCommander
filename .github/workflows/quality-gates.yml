name: Quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_sftp:
        description: Run the real SFTP round-trip against a temporary loopback server
        type: boolean
        default: false
      run_snapshots:
        description: Render the headless UI snapshots
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace-quality
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev
      - name: Test the authentication guard
        run: cargo test --locked -p rc-core auth_guard
      - name: Test the workspace
        run: |
          RCOMMANDER_CONFIG_DIR="$(mktemp -d "${RUNNER_TEMP}/rcommander-profile.XXXXXX")"
          export RCOMMANDER_CONFIG_DIR
          cargo test --locked --workspace
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build the release workspace
        run: cargo build --locked --workspace --release

  windows-auth-guard:
    name: Windows authentication guard
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the Windows account lock and cleanup
        run: |
          $env:RCOMMANDER_CONFIG_DIR = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $env:RCOMMANDER_CONFIG_DIR | Out-Null
          cargo test --locked -p rc-core auth_guard

  sftp:
    name: Real SFTP (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_sftp
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install OpenSSH and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server pkg-config libssl-dev
          sudo install -d -m 0755 /run/sshd
      - name: Run the real SFTP test
        run: python3 .github/scripts/test-local-sftp.py

  snapshots:
    name: Headless UI snapshots (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_snapshots
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-workspace-quality
          save-if: false
      - name: Install native build and software Vulkan dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libudev-dev mesa-vulkan-drivers
      - name: Render snapshots
        env:
          WGPU_BACKEND: vulkan
        run: |
          RCOMMANDER_CONFIG_DIR="$(mktemp -d "${RUNNER_TEMP}/rcommander-profile.XXXXXX")"
          export RCOMMANDER_CONFIG_DIR
          XDG_RUNTIME_DIR="$(mktemp -d "${RUNNER_TEMP}/rcommander-runtime.XXXXXX")"
          export XDG_RUNTIME_DIR
          cargo test --locked -p rcommander --test ui_smoke -- --ignored --exact render_snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: rcommander-ui-snapshots
          path: work/snapshots/*.png
          if-no-files-found: error
          retention-days: 7
